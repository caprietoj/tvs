name: Sistema TVS
description: Sistema integral de gestión escolar para el Colegio Teresiano Vida y Santidad

# Build settings
theme: jekyll-theme-cayman
plugins:
  - jekyll-relative-links
  - jekyll-seo-tag
  - jekyll-sitemap

# SEO
title: Sistema TVS - Documentación
tagline: Sistema de Gestión Escolar
url: https://caprietoj.github.io
baseurl: /tvs

# Social
github_username: caprietoj
repository: caprietoj/tvs

# Navigation
header_pages:
  - README.md
  - API.md
  - CONTRIBUTING.md
  - CHANGELOG.md

# Collections
collections:
  docs:
    output: true
    permalink: /:collection/:path/

# Defaults
defaults:
  - scope:
      path: ""
      type: "docs"
    values:
      layout: "page"
      
# Markdown
markdown: kramdown
kramdown:
  input: GFM
  syntax_highlighter: rouge

# Exclude from processing
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .git
  - .gitignore
  - .env
  - .env.example
  - composer.json
  - composer.lock
  - package.json
  - package-lock.json
  - webpack.mix.js
  - phpunit.xml
  - .phpunit.result.cache
  - storage
  - bootstrap/cache
